@if(!isEmpty){
    <c-row>
  <c-col xs="12" md="12" lg="12">
        <c-card class="mb-4 shadow-sm" *ngIf="PRODUCT()">
        <c-card-header >
            Producto: <strong>🆕 {{PRODUCT().name}}</strong>
        </c-card-header>

        <c-card-body>
            <!-- CATEGORÍA -->
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label cLabel>Categoría (*)</label>
                    <select
                        cSelect
                        [ngModelOptions]="{ standalone: true }"
                        [ngModel]="PRODUCT().id_categorie"
                        (ngModelChange)="updateId_categorie($event); id_categorieTouched = true"
                        [class.is-invalid]="id_categorieTouched && PRODUCT().id_categorie === 0"
                        (blur)="id_categorieTouched = true">
                        <option [ngValue]="0">— Seleccione categoría —</option>
                        @for (item of Categories; track item.id) {
                            <option [ngValue]="item.id">
                            {{ item.name }}
                            </option>
                        }
                    </select>
                    <small class="text-danger" *ngIf="id_categorieTouched && PRODUCT().id_categorie === 0">
                        La categoría es obligatoria
                    </small>
                </div>
               
                <div class="col-md-2 mb-3 border border-3 rounded shadow-sm p-3">
                    <label cLabel>Tarifa Iva(*)</label>
                    <div class="d-flex gap-3">
                    <c-form-check inline>
                        <input 
                        cFormCheckInput
                        type="radio"
                        name="tarifa_iva"
                        [value]="1"
                        [(ngModel)]="PRODUCT().tarifa_iva">
                        <label cFormCheckLabel>SI</label>
                    </c-form-check>

                    <c-form-check inline>
                        <input 
                        cFormCheckInput
                        type="radio"
                        name="tarifa_iva"
                        [value]="0"
                        [(ngModel)]="PRODUCT().tarifa_iva">
                        <label cFormCheckLabel>NO</label>
                    </c-form-check>
                    </div>
                </div>
                <div class="col-md-2 mb-3 border border-3 rounded shadow-sm p-3">
                    <label cLabel>Tarifa Ice(*)</label>
                    <div class="d-flex gap-3">
                    <c-form-check inline>
                        <input cFormCheckInput type="radio" name="tarifa_ice" [value]="1"
                        [(ngModel)]="tarifa_ice">
                        <label cFormCheckLabel>SI</label>
                    </c-form-check>

                    <c-form-check inline>
                        <input cFormCheckInput type="radio" name="tarifa_ice" [value]="0"
                        [(ngModel)]="tarifa_ice">
                        <label cFormCheckLabel>NO</label>
                    </c-form-check>
                    </div>
                </div>
                <div class="col-md-4 mb-3" *ngIf="tarifa_ice == 1">
                    <label cLabel>Selecciona tarifa ice(*)</label>
                    <label cLabel *ngIf="tarifa_ice == 1" class="mb-0">Codigo -- Porcentaje -- Tipo</label>
                    <select cSelect class="mt-0" 
                            [ngModelOptions]="{ standalone: true }" 
                            [(ngModel)]="PRODUCT().id_ice_tarifa" 
                            (ngModelChange)="updateId_Ice_Tarifa($event)">
                        <option value="0">- Seleccione Tarifa ice -</option>
                        @for(item of TarifasIce; track item.id){
                            <option [value]="item.id"> {{item.codigo_porcentaje}} -- {{item.tarifa}} -- {{item.tipo}}</option>
                        }    
                    </select>

                    <small class="text-danger" *ngIf="id_ice_tarifaTouched && PRODUCT().id_ice_tarifa === null">
                        La tarifa es obligatoria
                    </small>
                </div>
            </div>

            <!-- CÓDIGO / NOMBRE -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label cLabel>Nombre (*)</label>
                    <input 
                    cFormControl
                    type="text"
                    placeholder="Ej: Producto A"
                    [value]="PRODUCT().name"
                    (input)="updateName($event)"
                    [class.is-invalid]="nameTouched && !PRODUCT().name?.trim()"
                    (blur)="nameTouched = true"
                    (change)="updateName($event); nameTouched = true"/>
                    <small class="text-danger" *ngIf="nameTouched && !PRODUCT().name?.trim()">
                    Nombre obligatorio
                    </small>
                </div>

                <div class="col-md-3 mb-3">
                    <label cLabel>Ingresar codigo de barras(*)</label>
                    <select
                        cSelect
                        [class.is-invalid]="type_cod_proTouched && PRODUCT().type_cod_pro === '0'"
                        (blur) ="type_cod_proTouched = true"
                        [value]="PRODUCT().type_cod_pro"
                        (change)="updateType_Cod_Pro($event); type_cod_proTouched = true">
                        <option value="0">— Seleccione tipo codigo —</option>
                        <option value="1">Automatico</option>
                        <option value="2">Manual</option>
                        <!-- <option value="2">Manual - EAN13</option> -->
                    </select>
                    <small class="text-danger" *ngIf="type_cod_proTouched && PRODUCT().type_cod_pro === '0'">
                        Tipo codigo es obligatoria
                    </small>
                </div>

                <div class="col-md-3 mb-3" *ngIf="PRODUCT().type_cod_pro == '2'">
                    <label cLabel>Codigo de barras(*)</label>
                    <input 
                    cFormControl
                    type="text"
                    placeholder="Ej: 887766541237"
                    [value]="PRODUCT().cod_pro_barras"
                    (input)="updateCod_Pro_Barras($event)"
                    [class.is-invalid]="cod_pro_barrasTouched && !PRODUCT().cod_pro_barras?.trim()"
                    (blur)="cod_pro_barrasTouched = true"
                    (change)="updateCod_Pro_Barras($event); cod_pro_barrasTouched = true"/>
                    <small class="text-danger" *ngIf="cod_pro_barrasTouched && !PRODUCT().cod_pro_barras?.trim()">
                    Codigo de producto es obligatorio
                    </small>
                </div>
            </div>

            <!-- PRECIO / STOCK -->
            <div class="row">
            <div class="col-md-4 mb-3">
                <label cLabel>Precio (*)</label>
                <input
                cFormControl
                type="number"
                min="0"
                step="0.01"
                placeholder="Ej: 2.50"
                [value]="PRODUCT().price"
                (input)="updatePrice($event)"
                [class.is-invalid]="priceTouched && !PRODUCT().price?.trim()"
                (blur)="priceTouched = true"
                (change)="updatePrice($event); priceTouched = true" />
                <small class="text-danger" *ngIf="priceTouched && PRODUCT().price <= 0">
                Precio inválido
                </small>
            </div>

            <div class="col-md-4 mb-3">
                <label cLabel>Stock (*)</label>
                <input
                cFormControl
                type="number"
                min="0"
                placeholder="Ej: 10"
                [value]="PRODUCT().stock"
                (input)="updateStock($event)"
                [class.is-invalid]="stockTouched && (PRODUCT().stock < 0 || PRODUCT().stock === '')"
                (blur)="stockTouched = true"
                (change)="updateStock($event); stockTouched = true"/>
                <small class="text-danger" *ngIf="stockTouched && (PRODUCT().stock < 0 || PRODUCT().stock === '')">
                Stock inválido
                </small>
            </div>

            <div class="col-md-4 mb-3">
                <label cLabel>Stock mínimo (*)</label>
                <input
                cFormControl
                type="number"
                min="0"
                placeholder="Ej: 3"
                [value]="PRODUCT().stock_min"
                (input)="updateStockMin($event)"
                [class.is-invalid]="stock_minTouched && (PRODUCT().stock_min < 0 || PRODUCT().stock_min === '')"
                (blur)="stock_minTouched = true"
                (change)="updateStockMin($event); stock_minTouched = true"/>
                <small class="text-danger" *ngIf="stock_minTouched && (PRODUCT().stock_min < 0 || PRODUCT().stock_min === '')">
                Stock mínimo inválido
                </small>
            </div>
            </div>

            <!-- DESCRIPCIÓN -->
            <div class="row">
                <div class="col-md-8 mb-3">
                    <label cLabel>Descripción (*)</label>
                    <textarea
                        cFormControl
                        rows="4"
                        placeholder="Descripción del producto..."
                        (input)="updateDescription($event)"
                        [class.is-invalid]="descriptionTouched && !PRODUCT().description?.trim()"
                        (blur)="descriptionTouched = true"
                        (change)="updateDescription($event); descriptionTouched = true"
                        [value]="PRODUCT().description?.trim()">
                    </textarea>
                    <small class="text-danger" *ngIf="descriptionTouched && !PRODUCT().description?.trim()">
                        La descripción es obligatoria
                    </small>
                </div>
                <!-- IMAGEN -->
                <div class="col-md-4 mb-3">
                    <label cLabel class="d-block mb-1">Imagen</label>
                    <input
                        type="file"
                        hidden
                        id="productImage"
                        accept="image/*"
                        (change)="processFile($event)"/>
                    <img
                        [src]="imagen_previsualiza"
                        (click)="clickInputFileHide()"
                        class="img-thumbnail"
                        style="width: 120px; height: 120px; object-fit: cover; cursor: pointer"
                        title="Click para cambiar imagen"/>
                </div>
            </div>

            <!-- BOTONES -->
            <div class="row g-2">
            <div class="col-md-6">
                <button
                cButton
                color="primary"
                class="w-100"
                [disabled]="!isFormValid()"
                (click)="save()">
                <svg [cIcon]="icons.cilSave"></svg>
                Actualizar
                </button>
            </div>

            <div class="col-md-6">
                <button
                cButton
                color="danger"
                class="w-100"
                (click)="goList()">
                <svg [cIcon]="icons.cilBan"></svg>
                Cancelar
                </button>
            </div>
            </div>

      </c-card-body>
    </c-card>
  </c-col>
</c-row>
}@else{
  <div class="loading-overlay text-center p-5">
      <div class="spinner-border" role="status" aria-hidden="true"></div>
  </div>
}
