<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form cForm>
                <h1>Ingresar</h1>
                <p class="text-body-secondary">Inicia sesión con tu cuenta</p>
                <c-input-group class="mb-3">
                  <span cInputGroupText>
                    <svg cIcon name="cilUser"></svg>
                  </span>
                  <input name="email" [(ngModel)]="email" autoComplete="username" cFormControl placeholder="Usuario" />
                </c-input-group>
                <c-input-group class="mb-4">
                  <span cInputGroupText>
                    <svg cIcon name="cilLockLocked"></svg>
                  </span>
                  <input
                    name="password" [(ngModel)]="password"
                    autoComplete="current-password"
                    [type]="showPassword ? 'text' : 'password'"
                    cFormControl
                    placeholder="Password"
                    type="password"
                  />
                  <!-- Icono derecho (ver / ocultar) -->
                  <button
                    type="button"
                    cInputGroupText
                    (click)="togglePassword()"
                    style="cursor: pointer">
                    <svg cIcon [name]="showPassword ? 'cilEyeSlash' : 'cilEye'"></svg>
                  </button>
                </c-input-group>
                <c-row>
                  <c-col xs="6">
                    <button [disabled]="disableBtn" (click)="login()" cButton class="px-4" color="primary">
                      @if(loadingRegister){
                        <c-spinner aria-hidden="false" size="sm"></c-spinner>Cargando...
                      }@else{
                        Ingresar
                      }
                    </button>
                  </c-col>
                  <c-col class="text-end" xs="6">
                    <button cButton class="px-0" (click)="goRecoverPassword()" color="link">
                      ¿Has olvidado tu contraseña?
                    </button>
                  </c-col>
                </c-row>
              </form>
            </c-card-body>
          </c-card>
          <c-card [ngStyle]="{'minWidth.%': 44}" class="text-white bg-primary py-5">
            <c-card-body class="text-center">
              <div>
                <h2>Registrarse</h2>
                <p>
                  Registrate para que puedas ingresar al sistema
                   y utilizar sus funciones.
                </p>
                <button [active]="true" cButton class="mt-3" color="primary" routerLink="/register">
                  Registrate ahora!
                </button>
              </div>
            </c-card-body>
          </c-card>
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>
