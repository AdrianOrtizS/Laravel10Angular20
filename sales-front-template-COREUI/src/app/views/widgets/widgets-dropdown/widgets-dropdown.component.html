<c-row class="g-4">
  
  <c-col sm="6" xl="4" *ngIf="total_current_year > 0">
    <c-widget-stat-a
      color="primary"
      [title]="'Vent. anual sucursal '+branch_name">
      <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
        ${{total_current_year}}
        <span class="fw-normal" style="font-size: 12px;">
          {{percent_difference}}% 
          <svg *ngIf="percent_difference < 0" cIcon name="cilArrowBottom" size="sm"></svg>
          <svg *ngIf="percent_difference >= 0" cIcon name="cilArrowTop" size="sm"></svg>
        </span>
      </ng-template>
      <ng-template cTemplateId="widgetChartTemplate">
        <c-chart [data]="data[0]" [options]="options[0]" class="mt-3 mx-3" height="70" [type]="'line'" />
      </ng-template>
    </c-widget-stat-a>
  </c-col>

  <c-col sm="6" xl="4" *ngIf="total_last_10days > 0">
    <c-widget-stat-a
      [title]="'Ventas ultimos 10 dias '+branch_name"
      color="info">
      <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
        <span>${{total_last_10days}}</span>
      </ng-template>
      <ng-template cTemplateId="widgetChartTemplate">
        <c-chart [data]="data[1]" [options]="options[1]" class="mt-3 mx-3" height="70" type="line" />
      </ng-template>
    </c-widget-stat-a>
  </c-col>

  <!-- <c-col sm="6" xl="3" *ngIf="total_products_low_stock > 0">
    <c-widget-stat-a
      [title]="'Prod. con stock minimo'"
      color="warning"
    >
      <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
        <span>{{total_products_low_stock}} unid.</span>
      </ng-template>
      <ng-template cTemplateId="widgetChartTemplate">
        <c-chart [data]="data[2]" [options]="options[2]" class="mt-3" height="70" type="line" />
      </ng-template>
    </c-widget-stat-a>
  </c-col> -->

  <c-col sm="6" xl="4" *ngIf="total_products > 0">
    <c-widget-stat-a

      [title]="'Prod. mas vendidos en el año '+branch_name"
      color="danger">
      <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
        <span>{{total_products}} unid.</span>
      </ng-template>
      <ng-template cTemplateId="widgetChartTemplate">
        <c-chart [data]="data[3]" [options]="options[3]" class="mt-3 mx-3" height="70" type="bar" />
      </ng-template>
    </c-widget-stat-a>
  </c-col>

</c-row>
